<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엽서 선택 - 디자인하기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Marcellus&family=Outfit:wght@300;400;600;800&family=Noto+Serif+KR:wght@400;700&display=swap');

        :root {
            --primary: #3b82f6;
            --primary-strong: #1d4ed8;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
            --ink: #1e293b;
            --muted: #64748b;
            --accent: #f59e0b;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            font-family: 'Outfit', 'Pretendard', sans-serif;
            background: #f8fafc;
            background-image:
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.05) 0px, transparent 50%);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .shell {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Marcellus', 'Noto Serif KR', serif;
            font-size: clamp(28px, 4vw, 36px);
            margin: 0;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Selection Stage */
        .stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
        }

        /* Large Preview */
        .preview-container {
            width: 100%;
            max-width: 800px;
            position: relative;
            perspective: 1000px;
        }

        .frame-wrapper {
            width: 100%;
            aspect-ratio: 18.22 / 12.9;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.15);
            background: #fff;
            transform: rotateX(2deg);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 2;
        }

        .frame-wrapper:hover {
            transform: rotateX(0deg) translateY(-10px);
            box-shadow: 0 50px 120px -20px rgba(0, 0, 0, 0.2);
        }

        .preview-image {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.8s ease, filter 0.4s ease;
        }

        /* Nav Buttons Overlay */
        .nav-overlay {
            position: absolute;
            top: 50%;
            left: -30px;
            right: -30px;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }

        .nav-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: white;
            border: 1px solid #e2e8f0;
            color: var(--ink);
            font-size: 24px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: grid;
            place-items: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        .nav-btn:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.1);
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.3);
            border-color: var(--primary);
        }

        /* Circular Thumbnails */
        .thumbnails-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 10px;
        }

        .thumb-item {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .thumb-item::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .thumb-item:hover {
            transform: translateY(-5px) scale(1.1);
        }

        .thumb-item.active {
            transform: translateY(-8px) scale(1.15);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .thumb-item.active::after {
            border-color: var(--primary);
            inset: -6px;
        }

        /* Action Section */
        .actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
        }

        .info-panel {
            text-align: center;
        }

        .template-name {
            font-family: 'Marcellus', serif;
            font-size: 24px;
            margin: 0 0 8px 0;
            color: var(--ink);
        }

        .template-counter {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--muted);
            text-transform: uppercase;
        }

        .main-btn {
            width: 100%;
            padding: 20px;
            border-radius: 20px;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, #2563eb 100%);
            color: white;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px -5px rgba(59, 130, 246, 0.4);
            letter-spacing: 0.02em;
        }

        .main-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 45px -5px rgba(59, 130, 246, 0.5);
        }

        .back-link {
            text-decoration: none;
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--ink);
        }

        @media (max-width: 768px) {
            .nav-overlay {
                display: none;
            }

            .shell {
                padding: 40px 16px;
            }

            .thumb-item {
                width: 55px;
                height: 55px;
            }

            .frame-wrapper {
                border-radius: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="shell">
        <header class="header">
            <span class="template-counter" id="counter-text">01 / 06</span>
            <h1 id="tpl-name">Loading...</h1>
        </header>

        <section class="stage">
            <div class="preview-container">
                <div class="frame-wrapper">
                    <div class="preview-image" id="preview-img"></div>
                </div>

                <div class="nav-overlay">
                    <button class="nav-btn" id="prev-btn" title="이전">‹</button>
                    <button class="nav-btn" id="next-btn" title="다음">›</button>
                </div>
            </div>

            <div class="thumbnails-container" id="thumb-grid">
                <!-- Circular thumbnails will be injected here -->
            </div>
        </section>

        <div class="actions">
            <button class="main-btn" id="select-btn">이 디자인으로 시작하기</button>
            <a href="javascript:history.back()" class="back-link">위치로 돌아가기</a>
        </div>
    </div>

    <script>
        const postboxId = "{{ postbox_id }}";
        const templates = [
            { id: 1, name: 'BEYOND HORIZON', image: "{{ url_for('static', filename='images/postcards/postcard1.jpg') }}" },
            { id: 2, name: 'SECRET GARDEN', image: "{{ url_for('static', filename='images/postcards/postcard2.jpg') }}" },
            { id: 3, name: 'ETERNAL BLUE', image: "{{ url_for('static', filename='images/postcards/postcard3.jpg') }}" },
            { id: 4, name: 'SOFT PASTELL', image: "{{ url_for('static', filename='images/postcards/postcard4.jpg') }}" },
            { id: 5, name: 'VINTAGE 2026', image: "{{ url_for('static', filename='images/postcards/postcard5.jpg') }}" },
            { id: 6, name: 'OCEAN BREEZE', image: "{{ url_for('static', filename='images/postcards/postcard6.jpg') }}" },
        ];

        let currentIndex = 0;
        const previewImg = document.getElementById('preview-img');
        const tplName = document.getElementById('tpl-name');
        const counterText = document.getElementById('counter-text');
        const thumbGrid = document.getElementById('thumb-grid');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const selectBtn = document.getElementById('select-btn');

        function init() {
            templates.forEach((tpl, idx) => {
                const thumb = document.createElement('div');
                thumb.className = 'thumb-item';
                thumb.style.backgroundImage = `url(${tpl.image})`;
                thumb.onclick = () => {
                    currentIndex = idx;
                    updateUI();
                };
                thumbGrid.appendChild(thumb);
            });
            updateUI();
        }

        function updateUI() {
            const tpl = templates[currentIndex];

            // Image with transition support
            previewImg.style.opacity = 0.5;
            setTimeout(() => {
                previewImg.style.backgroundImage = `url(${tpl.image})`;
                previewImg.style.opacity = 1;
            }, 50);

            tplName.textContent = tpl.name;
            counterText.textContent = `${(currentIndex + 1).toString().padStart(2, '0')} / ${templates.length.toString().padStart(2, '0')}`;

            // Thumbnails
            const thumbs = document.querySelectorAll('.thumb-item');
            thumbs.forEach((t, idx) => {
                t.classList.toggle('active', idx === currentIndex);
            });
        }

        prevBtn.onclick = () => {
            currentIndex = (currentIndex - 1 + templates.length) % templates.length;
            updateUI();
        };

        nextBtn.onclick = () => {
            currentIndex = (currentIndex + 1) % templates.length;
            updateUI();
        };

        selectBtn.onclick = () => {
            const tpl = templates[currentIndex];
            const url = new URL(window.location.origin + `/send/${postboxId}/write`);
            url.searchParams.set('template_id', tpl.id);
            url.searchParams.set('template_type', 0);
            url.searchParams.set('template_name', tpl.name);
            window.location.href = url.toString();
        };

        init();
    </script>
</body>

</html>
